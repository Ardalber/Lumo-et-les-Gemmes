  <circle cx="153" cy="138" r="10" fill="#0d0d1a"/>
  <circle cx="157" cy="133" r="4" fill="#ffffff"/>
  <!-- joue -->
  <circle cx="102" cy="168" r="9" fill="#ff8c99" opacity="0.8"/>
  <!-- gemme -->
  <polygon points="206,96 230,120 206,156 182,120" fill="#0c4fa8"/>
  <polygon points="206,102 224,120 206,148 188,120" fill="url(#gem)"/>
  <polygon points="206,102 214,120 206,124 198,120" fill="#ffffff" opacity="0.7"/>
