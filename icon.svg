<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc8ff"/>
      <stop offset="1" stop-color="#c9ecff"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bff4ff"/>
      <stop offset="1" stop-color="#2a8cff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#sky)"/>
  <!-- sol -->
  <rect x="0" y="206" width="256" height="50" fill="#7a4b26"/>
  <rect x="0" y="198" width="256" height="16" fill="#4fbf4a"/>
  <!-- antenne lumineuse -->
  <circle cx="92" cy="54" r="34" fill="url(#halo)"/>
  <path d="M110 112 Q96 84 92 58" fill="none" stroke="#1f4d4d" stroke-width="7" stroke-linecap="round"/>
  <circle cx="92" cy="54" r="13" fill="#ffe24d" stroke="#c9a400" stroke-width="3"/>
  <!-- corps de Lumo -->
  <ellipse cx="124" cy="160" rx="64" ry="56" fill="#1f4d4d"/>
  <ellipse cx="124" cy="156" rx="58" ry="50" fill="#40bf99"/>
  <ellipse cx="138" cy="176" rx="32" ry="24" fill="#bff2d9"/>
  <!-- oeil -->
